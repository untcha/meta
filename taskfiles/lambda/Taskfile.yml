# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Source: https://github.com/untcha/meta (taskfiles/lambda/Taskfile.yml)
# Taskfile for AWS Lambda functions written in Go (provided.al2023 / bootstrap).
# Shared Go tasks (fmt, lint, deps, test:*, coverage, clean:caches/coverage) live
# in taskfiles/common.yml and are flattened into this namespace. This file adds the
# Lambda-specific build, package, and deploy tasks.
# For CLI tools or libraries, start from the matching template in untcha/meta.

includes:
  # Shared tasks, flattened so they appear unprefixed (e.g. `task lint`).
  #
  # The path is relative to the DESTINATION repo root, where this file becomes
  # Taskfile.yml beside a vendored taskfiles/common.yml. It therefore does not
  # resolve here in the templates directory, and that is deliberate: making it
  # ../common.yml would work here and silently escape every consuming repo.
  common:
    taskfile: ./taskfiles/common.yml
    flatten: true

  # Repo-specific tasks live here and are namespaced (e.g. `task project:update:schema`).
  # optional:true keeps this generic Taskfile usable in repos without a project file.
  # Keep the file at that path: because the include is optional, a mismatch is
  # silent — the tasks simply never appear and `task` still exits 0.
  project:
    taskfile: ./taskfiles/Taskfile.project.yml
    optional: true

vars:
  META_TYPE: lambda

  # Metadata variables for the Lambda function
  APP_NAME: "acme-lambda-name"
  BIN_NAME: "bootstrap"
  LAMBDA_FUNCTION_NAME: "go-acme-lambda-name"

  TARGET_OS: '{{default "linux" .TARGET_OS}}'
  TARGET_ARCH: '{{default "amd64" .TARGET_ARCH}}'

  CGO: CGO_ENABLED=0
  GOHOST: "GOOS={{.TARGET_OS}} GOARCH={{.TARGET_ARCH}}"

  # Local builds go under dist/, never bin/. The Terraform builder module owns
  # bin/ and zips that whole directory, so anything else left there would end up
  # inside the Lambda package.
  BIN_DIR: "dist/{{.TARGET_OS}}-{{.TARGET_ARCH}}"
  BIN_PATH: "{{.BIN_DIR}}/{{.BIN_NAME}}"

  ARTIFACT_PATH: '{{default (printf "dist/%s-%s-%s.zip" .APP_NAME .TARGET_OS .TARGET_ARCH) .ARTIFACT_PATH}}'

  # APPMETA_DIR is the package whose vars get stamped with version/commit/date.
  # Build stamping only happens when this directory exists (see LDFLAGS).
  APPMETA_DIR: internal/appmeta
  MODULE_PATH:
    sh: go list -m
  APPMETA_MODULE_PATH: "{{.MODULE_PATH}}/{{.APPMETA_DIR}}"
  # BUILD_VERSION is the version stamped into the binary. A VERSION environment
  # variable (e.g. from CI) wins; otherwise the latest git tag, else the short
  # commit, with "-dirty" for uncommitted changes; "dev" outside a git repo.
  BUILD_VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"

  # LDFLAGS stamps version metadata into {{.APPMETA_DIR}} when that package
  # exists; otherwise it falls back to plain strip flags so projects without
  # an appmeta package build cleanly.
  LDFLAGS:
    sh: |
      if [ ! -d "{{.APPMETA_DIR}}" ]; then
        echo "-s -w"
        exit 0
      fi
      VERSION_VALUE="{{.BUILD_VERSION}}"
      COMMIT_VALUE="${COMMIT:-{{.GIT_COMMIT}}}"
      BUILD_DATE_VALUE="${BUILD_DATE:-{{.BUILD_DATE}}}"
      echo "-s -w \
      -X {{.APPMETA_MODULE_PATH}}.Version=${VERSION_VALUE} \
      -X {{.APPMETA_MODULE_PATH}}.Commit=${COMMIT_VALUE} \
      -X {{.APPMETA_MODULE_PATH}}.BuildDate=${BUILD_DATE_VALUE}"

tasks:
  build:
    desc: Build the Lambda binary for the target OS/ARCH
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - "{{.CGO}} {{.GOHOST}} go build -a -trimpath -ldflags='{{.LDFLAGS}}' -o {{.BIN_PATH}} ./cmd"
    sources:
      # Add any files pulled in with go:embed. They change the binary, but
      # Task only sees what is listed here, so an edit to one would leave a
      # stale binary that Task still reports as up to date.
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_PATH}}"

  build:check:
    desc: Run checks, then build the Lambda binary
    cmds:
      - task: check
      - task: build

  check:
    desc: Run all checks (formatting, linting, tests)
    cmds:
      - task: fmt
      - task: lint
      - task: test:existing

  clean:
    desc: Clean temp files and folders
    cmds:
      - rm -rf ./dist/
      # bin/ is written by the Terraform builder module, not by this Taskfile.
      # Removing it is safe: the next plan finds no binary and rebuilds.
      - rm -rf ./bin/

  clean:all:
    desc: Clean everything (builds, caches, coverage)
    cmds:
      - task: clean
      - task: clean:caches
      - task: clean:coverage

  deploy:
    desc: Deploy the packaged Lambda code to AWS
    cmds:
      - task: package
      - |
        if [ -z "{{.LAMBDA_FUNCTION_NAME}}" ]; then
          echo "LAMBDA_FUNCTION_NAME is required" >&2
          exit 1
        fi
      - |
        REGION_VALUE="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
        if [ -z "${REGION_VALUE}" ]; then
          echo "AWS_REGION or AWS_DEFAULT_REGION must be set" >&2
          exit 1
        fi
      - |
        if [ ! -f "{{.ARTIFACT_PATH}}" ]; then
          echo "artifact not found: {{.ARTIFACT_PATH}}" >&2
          exit 1
        fi
      - |
        REGION_VALUE="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
        aws lambda update-function-code \
          --region "${REGION_VALUE}" \
          --function-name {{.LAMBDA_FUNCTION_NAME}} \
          --zip-file fileb://{{.ARTIFACT_PATH}}
      - |
        REGION_VALUE="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
        aws lambda wait function-updated \
          --region "${REGION_VALUE}" \
          --function-name {{.LAMBDA_FUNCTION_NAME}}

  package:
    desc: Package the Lambda binary into a zip artifact
    cmds:
      - task: build
      - mkdir -p $(dirname {{.ARTIFACT_PATH}})
      - rm -f {{.ARTIFACT_PATH}}
      - zip -j {{.ARTIFACT_PATH}} {{.BIN_PATH}}
    sources:
      - "{{.BIN_PATH}}"
    generates:
      - "{{.ARTIFACT_PATH}}"

  package:clean:
    desc: Remove packaged Lambda artifacts
    cmds:
      - rm -f dist/*.zip
