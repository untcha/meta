# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Source: https://github.com/untcha/meta (taskfiles/Taskfile.project.yml)
# Stub for repo-specific tasks. Copy it to taskfiles/Taskfile.project.yml in the
# consuming repo, retitle the header for that project, and add tasks below.
#
# Ship this file even when a repo has no project tasks yet. The project-type
# Taskfiles include it with `optional: true`, which means a missing file or a
# mistyped path is SILENT — the tasks simply never appear and `task` still exits
# 0. Keeping the stub at the expected path means the first task added shows up
# immediately, instead of the include quietly pointing at nothing.
#
# Two things to know when writing tasks here:
#
#   1. This file is included UNDER a namespace, so tasks run as
#      `task project:<name>` (e.g. `task project:deploy`), and a `task: build`
#      reference inside it resolves to a task in THIS file. To call a task from
#      the root Taskfile or from common.yml, prefix it with a colon:
#      `task: :lint`, `task: :build`, `deps: [":build"]`.
#
#   2. Vars from the root Taskfile ARE visible here — BIN_NAME, APP_NAME,
#      BIN_DIR, RELEASE_TARGETS and friends resolve without being passed in.
#      (Verified against Task 3.53.1; some repos carry a redundant
#      `vars: {BIN_NAME: "{{.BIN_NAME}}"}` on the include, which is not needed.)

tasks: {}
